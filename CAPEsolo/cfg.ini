[analysis_directory]
analysis = C:\Users\Public\CAPEsolo\analysis

; This file holds the shipped defaults and is OVERWRITTEN by pip upgrades.
; Put your own settings in C:\Users\Public\CAPEsolo\cfg.ini instead - it overrides this
; file per key, needs only the keys you change, and pip never touches it.
;
; Optional. Defaults are stdio / 127.0.0.1 / 8000 / /mcp when this section is absent.
; Uncomment to reach the MCP server from the host over a host-only VM network.
; Keep the token in the CAPESOLO_MCP_TOKEN environment variable, not in either cfg.ini.
;[mcp_server]
;transport = streamable-http
;host = 192.168.56.10
;port = 8000
;path = /mcp
;allowed_hosts = 192.168.56.10:8000
;allowed_origins =
