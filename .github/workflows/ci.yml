name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same PR makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # wxPython has no manylinux wheel, and building it from the sdist takes ~20 min.
      # Ubuntu's package is wxPython 4.2 on GTK3, which is what the theme and contrast
      # tests need. The application's other dependencies (pywin32, yara, sflock, ...) are
      # deliberately not installed: nothing under tests/ imports them.
      - name: Install wxPython and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-wxgtk4.0 python3-pytest

      - name: Byte-compile
        run: python3 -m compileall -q CAPEsolo tools

      - name: Unit tests
        run: python3 -m pytest tests -q

  ui:
    name: ui render
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install wxPython and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-wxgtk4.0 xvfb

      # Builds MainFrame and every result panel in both themes, switches the theme at
      # runtime and opens the dialogs. Catches the usual breakage - a widget constructed
      # with an argument it no longer takes, a sizer added to itself, a missing token.
      - name: Panel smoke test
        run: xvfb-run -a python3 tools/uidev/smoke.py

      # Renders the visual-regression shot list and compares it with the recorded
      # baseline. The baseline carries the font stack of the machine that recorded it, so
      # a mismatch here is often just fontconfig; the renders and diffs are uploaded for a
      # human to look at rather than failing the build.
      - name: Render UI
        id: render
        continue-on-error: true
        run: xvfb-run -a python3 tools/uidev/vrt.py --out "${RUNNER_TEMP}/vrt"

      - name: Upload renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders
          path: |
            ${{ runner.temp }}/vrt
            tools/uidev/baseline
          if-no-files-found: warn

      - name: Note visual differences
        if: steps.render.outcome == 'failure'
        run: |
          echo "::notice::Renders differ from the baseline. Download the ui-renders" \
               "artifact and compare. If the change is intended, re-record with" \
               "'xvfb-run -a python3 tools/uidev/vrt.py --update'."
